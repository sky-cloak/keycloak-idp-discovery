name: Release

on:
  push:
    tags:
      - "v*.*.*"

permissions:
  contents: write
  packages: write

jobs:
  release:
    name: Build and publish release
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Set up JDK 21
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: "21"
          cache: maven

      - name: Verify tag matches pom version
        run: |
          TAG_VERSION="${GITHUB_REF_NAME#v}"
          POM_VERSION=$(mvn -q help:evaluate -Dexpression=project.version -DforceStdout)
          if [[ "$TAG_VERSION" != "$POM_VERSION" ]]; then
            echo "::error::Tag '$GITHUB_REF_NAME' implies version '$TAG_VERSION' but pom.xml declares '$POM_VERSION'. Bump the pom or retag."
            exit 1
          fi
          echo "Releasing $POM_VERSION"

      # This extends Keycloak's internal implementation classes (not just the
      # public SPI), which genuinely differ across 26.x patch lines - no
      # secondary older-version compile check here. Pinned to 26.7.3 only.
      - name: Build release JAR against Keycloak 26.7.3
        run: mvn -B -Dkeycloak.version=26.7.3 package

      - name: Compose release notes
        id: notes
        run: |
          set -euo pipefail
          # Nearest ANCESTOR tag on this branch's history, not merely the highest
          # version number - avoids picking up an out-of-order back-tagged release.
          PREV_TAG=$(git describe --tags --abbrev=0 "${GITHUB_REF_NAME}^" 2>/dev/null || true)
          ARTIFACT=$(ls target/*.jar | grep -v -E '(sources|javadoc)\.jar$' | head -n1)
          ARTIFACT_NAME=$(basename "$ARTIFACT")
          {
            echo "## Install"
            echo
            echo "Download \`${ARTIFACT_NAME}\` from the Assets below and copy it into Keycloak's providers directory:"
            echo
            echo '```bash'
            echo "cp ${ARTIFACT_NAME} /opt/keycloak/providers/"
            echo '```'
            echo
            echo "Restart Keycloak. See the [README](https://github.com/${GITHUB_REPOSITORY}#readme) for configuration and flow setup."
            echo
            echo "## Keycloak compatibility"
            echo
            echo "Built against and pinned to **Keycloak 26.7.3** only. This extends Keycloak's"
            echo "internal implementation classes, not just the public SPI, so it is not expected"
            echo "to compile against other 26.x versions without changes."
            echo
            if [[ -n "$PREV_TAG" ]]; then
              echo "## Changes since ${PREV_TAG}"
              echo
              git log --pretty='* %s (%h)' "${PREV_TAG}..HEAD"
            else
              echo "## First tagged release"
              echo
              echo "See the README for what ships in this version."
            fi
          } > release-notes.md
          echo "artifact_path=$ARTIFACT" >> "$GITHUB_OUTPUT"

      - name: Create release and attach JAR
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          IS_PRERELEASE=""
          if [[ "$GITHUB_REF_NAME" == *-* ]]; then
            IS_PRERELEASE="--prerelease"
          fi
          gh release create "$GITHUB_REF_NAME" \
            --title "$GITHUB_REF_NAME" \
            --notes-file release-notes.md \
            $IS_PRERELEASE \
            "${{ steps.notes.outputs.artifact_path }}"

      # OCI artifact for keycloak-base-image consumption (COPY --from pattern).
      - uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Determine image tags
        id: image-tags
        run: |
          TAGS="ghcr.io/sky-cloak/keycloak-idp-discovery:${GITHUB_REF_NAME}"
          if [[ "$GITHUB_REF_NAME" != *-* ]]; then
            # Only a full release (no prerelease suffix, e.g. v0.1.0-rc1) moves
            # :latest - a prerelease tag must never clobber it.
            TAGS="${TAGS}
          ghcr.io/sky-cloak/keycloak-idp-discovery:latest"
          fi
          {
            echo "tags<<EOF"
            echo "$TAGS"
            echo "EOF"
          } >> "$GITHUB_OUTPUT"

      - name: Build and push OCI artifact
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./Dockerfile
          push: true
          platforms: linux/amd64,linux/arm64
          tags: ${{ steps.image-tags.outputs.tags }}
