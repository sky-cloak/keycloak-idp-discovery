name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    name: Build and test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - name: Set up JDK 21
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "21"
          cache: maven

      # No secondary "older Keycloak version" compile check here, unlike our
      # other extensions. This one extends Keycloak's internal implementation
      # classes (UsernamePasswordForm, IdentityProviderAuthenticator), not just
      # the public SPI surface, and those genuinely differ across 26.x patch
      # lines - confirmed: this does not compile against 26.2.0. Pinned to
      # 26.6.3 only. See VERSIONING.md.
      - name: Test and package (Keycloak 26.6.3)
        run: mvn -B -Dkeycloak.version=26.6.3 verify
