name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    name: Build and test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Set up JDK 21
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "21"
          cache: maven

      - name: Test and package (Keycloak 26.6.3)
        run: mvn -B -Dkeycloak.version=26.6.3 verify

      - name: Compile against Keycloak 26.2.0
        run: mvn -B -Dkeycloak.version=26.2.0 clean compile
